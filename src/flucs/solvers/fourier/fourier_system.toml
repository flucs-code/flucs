[time]
max_cfl = 0.2  # Maximum allowed CFL number
dt_mult_increase = 1.10 # Factor by which the timestep is allowed to increase
dt_mult_decrease = 0.75 # Factor by which the timestep is decreased (only used if precomputing)
dt_mult_steps = 10000  # Number of steps before the timestep can be increased
dt_method = "continuous"

[dimensions] 
# Padded and unpadded resolutions can either be determined automatically
# or specified explicitly.

# If nx = -1 and padded_nx = something positive,
# then an optimal nx for that padded_nx will be determined.

# If padded_nx = -1 but nx is specified, then the system chooses
# the minimum padded_nx that works.

# If both are specified, then they are used as given.

# N.B. The automatic resolution search supports only quadratic nonlinearities
# via the 3/2 rule.
nx = -1
ny = -1
nz = -1

padded_nx = -1
padded_ny = -1
padded_nz = -1

# Box dimensions must be specified
Lx = -1.0
Ly = -1.0
Lz = -1.0


# Finding optimal padded resolutions

# Prime numbers
padded_primes = [2, 3]
# Order of the nonlinear term
nonlinear_order = 2

[setup]
# If true, run a linear-only simulation
linear = false

# Degree N of the [N,N] Pade approximant for the linear propagator
linear_pade_degree = 2  # [1,1] is Crank-Nicolson

# Timestepper method
# Currently supported are ab3 and ab3_if
timestepper = "ab3_if"

# Whether the linear matrix should be computed each time step or precomputed
precompute_linear_matrix = false

# Whether to perform some predefined health checks (e.g., linear spectrum against a reference)
check_linear_matrix = true

[init]

# for method = "gaussian"
components = ['kx', 'ky']
width = 1.0
power = 6.0
phase = "random"

# Generic hyperdissipation that can be applied to any system. At the end of each
# timestep, the final fields are multipled by exp(-dt * hyper), where
# hyper = coefficient * (k        )**(2 * power),
# unless normalised, where we have 
# hyper = coefficient * (k / k_max)**(2 * power),
# where 'coefficient' is kz, kx, ky, or kperp.
# Set the coefficient to a negative number to disable.
# If set to be adaptive, the coefficient is multiplied by cfl_rate at each dt. 

[hyperdissipation]
kperp = -1.0
kperp_power = 2
kperp_adaptive = false
kperp_normalised = false

kx = -1.0
kx_power = 2
kx_adaptive = false
kx_normalised = false

ky = -1.0
ky_power = 2
ky_adaptive = false
ky_normalised = false

kz = -1.0
kz_power = 2
kz_adaptive = false
kz_normalised = false

[forcing]
method = ""

[output]

[output.0d]
save_steps = -1
diags = []
type = "netcdf4"

[output.1d]
save_steps = -1
diags = []
type = "netcdf4"

[output.2d]
save_steps = -1
diags = []
type = "netcdf4"

[output.3d]
save_steps = -1
diags = []
type = "netcdf4"

[output.realspace]
save_steps = -1
diags = []
type = "netcdf4"

[output.realspace1d]
save_steps = -1
diags = []
type = "netcdf4"

[output.realspace2d]
save_steps = -1
diags = []
type = "netcdf4"

[output.realspace3d]
save_steps = -1
diags = []
type = "netcdf4"

[output.eigensystem]
save_steps = -1
diags = []
type = "netcdf4"
